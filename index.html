    const SAMPLE_DATA = [

      },
      {
        "Creation Date": "7/24/2026",
        "Opportunity Status": "In Follow-Up",
        "Customer Name": "Dimpal Patel",
        "Estimate Created By": "Carlos",
        "Location Address": "2978 Morvale Drive, Westlake Village, CA 91361 USA",
        "Estimate Name": "Chimney Maintenance & Flue Inspection",
        "Estimates Subtotal": "$4,200.00",
        "Customer Phone": "(818) 555-9012",
        "Customer Email": "dimpal.patel@example.com"
      }
    ];

    const DEFAULT_TEMPLATE = {
      companyName: "Eco Grizzly",
      financingThreshold: 4000,
      subjectPattern: "Following up on our project estimate for {address}",
      bodyPattern: `Hello {first_name},

I know life gets busy, so I wanted to pop back into your inbox briefly regarding the estimate options we provided for {address}, and I wanted to make sure these details didn't get buried!

Here are the options we put together for your review:
{estimates_list}

Since we often provide a few different service levels or repair options, please let us know which option best fits what you'd like to move forward with! As a reminder, once you decide on an option and get scheduled, I'll be applying a special courtesy discount to the final invoice as a thank you for choosing Eco Grizzly.

{financing_clause}Do you have a few minutes this week to discuss which option works best for you, or do you need any adjustments made to any of the quotes? Let me know how I can best help!

Best regards,

Carlos`,
      financingClauseText: "Also, just so you're aware, for any project options over $4,000, we do offer flexible financing options if that helps fit the repair into your budget more comfortably.\n\n"
    };

    function App() {
      const [user, setUser] = useState(null);
      const [rawRows, setRawRows] = useState(SAMPLE_DATA);
      const [template, setTemplate] = useState(DEFAULT_TEMPLATE);
      const [sentMap, setSentMap] = useState({});
      const [editedEmailMap, setEditedEmailMap] = useState({});
      const [selectedGroup, setSelectedGroup] = useState(null);
      
      const [queueTab, setQueueTab] = useState('UNSENT');
      const [selectedRep, setSelectedRep] = useState('ALL');
      const [financingFilter, setFinancingFilter] = useState('ALL');
      const [sortBy, setSortBy] = useState('NEWEST');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [showSettings, setShowSettings] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [aiTone, setAiTone] = useState('Friendly');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      useEffect(() => {
        auth.signInAnonymously().catch(console.error);
        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
        });
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!user) return;

        const sharedDocRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('estimates_store').doc('shared_data');

        const unsubscribeSnapshot = sharedDocRef.onSnapshot(
          (snapshot) => {
            if (snapshot.exists) {
              const data = snapshot.data();
              if (data.rawRows && Array.isArray(data.rawRows)) setRawRows(data.rawRows);
              if (data.sentMap) setSentMap(data.sentMap);
              if (data.editedEmailMap) setEditedEmailMap(data.editedEmailMap);
              if (data.template) setTemplate(data.template);
            } else {
              sharedDocRef.set({
                rawRows: SAMPLE_DATA,
                sentMap: {},
                editedEmailMap: {},
                template: DEFAULT_TEMPLATE,
                lastUpdated: new Date().toISOString(),
                updatedBy: user.uid
              }, { merge: true }).catch(console.error);
            }
          },
          (error) => console.error("Firestore onSnapshot error:", error)
        );

        return () => unsubscribeSnapshot();
      }, [user]);

      const saveToCloud = async (updates) => {
        if (!user) return;
        setIsSyncing(true);
        try {
          const sharedDocRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('estimates_store').doc('shared_data');
          await sharedDocRef.set({
            ...updates,
            lastUpdated: new Date().toISOString(),
            updatedBy: user.uid
          }, { merge: true });
        } catch (err) {
          console.error("Cloud write error:", err);
          showToast("Cloud sync error. Working in local state.");
        } finally {
          setIsSyncing(false);
        }
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const copyToClipboard = (text, label) => {
        if (!text) return;
        navigator.clipboard.writeText(text);
        showToast(`${label} copied to clipboard!`);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const fileExt = file.name.split('.').pop().toLowerCase();

        if (fileExt === 'xlsx' || fileExt === 'xls') {
          const reader = new FileReader();
          reader.onload = async (evt) => {
            try {
              const data = new Uint8Array(evt.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

              if (jsonData && jsonData.length > 0) {
                setRawRows(jsonData);
                setSentMap({});
                setEditedEmailMap({});
                setSelectedGroup(null);
                await saveToCloud({ rawRows: jsonData, sentMap: {}, editedEmailMap: {} });
                showToast(`Uploaded ${jsonData.length} rows from ${file.name} to Firestore!`);
              } else {
                showToast("No data rows found in uploaded Excel file.");
              }
            } catch (err) {
              console.error("Excel parse error:", err);
              showToast("Error parsing Excel file.");
            }
          };
          reader.readAsArrayBuffer(file);
          return;
        }

        // CSV Parser
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const text = evt.target.result;
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) {
              showToast("Uploaded CSV file is empty!");
              return;
            }

            const parseCSVLine = (line) => {
              const result = [];
              let start = 0;
              let inQuotes = false;
              for (let i = 0; i < line.length; i++) {
                if (line[i] === '"') {
                  inQuotes = !inQuotes;
                } else if (line[i] === ',' && !inQuotes) {
                  let val = line.substring(start, i).trim();
                  if (val.startsWith('"') && val.endsWith('"')) {
                    val = val.substring(1, val.length - 1).replace(/""/g, '"');
                  }
                  result.push(val);
                  start = i + 1;
                }
              }
              let val = line.substring(start).trim();
              if (val.startsWith('"') && val.endsWith('"')) {
                val = val.substring(1, val.length - 1).replace(/""/g, '"');
              }
              result.push(val);
              return result;
            };

            const headers = parseCSVLine(lines[0]);
            const parsedData = [];

            for (let i = 1; i < lines.length; i++) {
              if (!lines[i].trim()) continue;
              const values = parseCSVLine(lines[i]);
              const row = {};
              headers.forEach((h, idx) => {
                row[h] = values[idx] || '';
              });
              parsedData.push(row);
            }

            if (parsedData.length > 0) {
              setRawRows(parsedData);
              setSentMap({});
              setEditedEmailMap({});
              setSelectedGroup(null);
              await saveToCloud({ rawRows: parsedData, sentMap: {}, editedEmailMap: {} });
              showToast(`Uploaded ${parsedData.length} records to Firestore!`);
            }
          } catch (err) {
            console.error("CSV parse error:", err);
            showToast("Error parsing CSV file.");
          }
        };
        reader.readAsText(file);
      };

      const groupedClients = useMemo(() => {
        if (!rawRows || rawRows.length === 0) return [];

        const map = {};

        rawRows.forEach((row) => {
          const getVal = (possibleKeys) => {
            for (const k of Object.keys(row)) {
              if (possibleKeys.some(pk => k.toLowerCase().trim() === pk.toLowerCase().trim())) {
                return String(row[k]).trim();
              }
            }
            return '';
          };

          const name = getVal(['customer name', 'customer', 'name', 'client name']);
          const address = getVal(['location address', 'address', 'location', 'property address']);
          const estimateName = getVal(['estimate name', 'estimate', 'service', 'job name']);
          const createDate = getVal(['creation date', 'created date', 'create date', 'date', 'created_at', 'estimate date']);
          
          const rawSubtotal = getVal(['estimates subtotal', 'estimate subtotal', 'subtotal', 'amount', 'total', 'price']);
          const subtotalNum = parseFloat(String(rawSubtotal).replace(/[^0-9.-]+/g, "")) || 0;

          const phone = getVal(['customer phone', "customer's phone", 'phone', 'mobile', 'phone number']);
          const email = getVal(['customer email', "customer's email", 'email']);
          const createdBy = getVal(['estimate created by', 'created by', 'createdby', 'rep', 'estimator', 'agent']);

          if (!name || name.toLowerCase().startsWith('sum:') || name.toLowerCase().startsWith('count:') || name.toLowerCase() === 'none') return;
          if (!estimateName || estimateName.toLowerCase().startsWith('sum:') || estimateName.toLowerCase().startsWith('count:')) return;

          const groupKey = `${name.toLowerCase()}_${address.toLowerCase()}`;

          if (!map[groupKey]) {
            map[groupKey] = {
              id: groupKey,
              customerName: name,
              firstName: name.split(' ')[0] || 'there',
              address: address || 'Your Property Address',
              phone: phone,
              email: email,
              createdBy: createdBy || 'Eco Grizzly Team',
              createDate: createDate || 'Recently',
              estimates: [],
              totalSubtotal: 0,
            };
          } else {
            if (!map[groupKey].phone && phone) map[groupKey].phone = phone;
            if (!map[groupKey].email && email) map[groupKey].email = email;
            if (!map[groupKey].createdBy && createdBy) map[groupKey].createdBy = createdBy;
          }

          map[groupKey].estimates.push({
            name: estimateName,
            subtotal: subtotalNum,
            rawRow: row
          });
          map[groupKey].totalSubtotal += subtotalNum;
        });

        return Object.values(map);
      }, [rawRows]);

      const generateEmailContent = (clientGroup) => {
        if (!clientGroup) return { subject: '', body: '' };

        const estimatesListText = clientGroup.estimates
          .map(e => `• ${e.name} — $${e.subtotal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`)
          .join('\n');

        const names = clientGroup.estimates.map(e => e.name);
        let combinedName = names.join(' & ');
        if (names.length > 2) {
          combinedName = names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
        }

        const isEligibleForFinancing = clientGroup.estimates.some(e => e.subtotal >= template.financingThreshold);
        const financingText = isEligibleForFinancing ? template.financingClauseText : '';

        let subject = template.subjectPattern
          .replace(/{address}/g, clientGroup.address)
          .replace(/{customer_name}/g, clientGroup.customerName)
          .replace(/{estimate_name}/g, combinedName);

        let body = template.bodyPattern
          .replace(/{first_name}/g, clientGroup.firstName)
          .replace(/{customer_name}/g, clientGroup.customerName)
          .replace(/{address}/g, clientGroup.address)
          .replace(/{estimates_list}/g, estimatesListText)
          .replace(/{estimate_name}/g, combinedName)
          .replace(/{financing_clause}/g, financingText);

        return { subject, body };
      };

      const handleAiPolish = (group) => {
        if (!group) return;
        setIsAiLoading(true);

        setTimeout(async () => {
          const current = editedEmailMap[group.id] || generateEmailContent(group);
          let polishedBody = current.body;

          if (aiTone === 'Friendly') {
            polishedBody = polishedBody.replace("I know life gets busy", "Hope you're having a wonderful week! I know things can get busy");
          } else if (aiTone === 'Urgent') {
            polishedBody = polishedBody.replace("I know life gets busy, so I wanted to pop back into your inbox briefly.", "I am reaching out to follow up on your estimate options so we can reserve your preferred installation dates on our schedule.");
          } else if (aiTone === 'High-Value Offer') {
            polishedBody = polishedBody.replace("applying a special courtesy discount", "applying an exclusive Eco Grizzly 5% courtesy discount");
          }

          const updatedMap = {
            ...editedEmailMap,
            [group.id]: {
              subject: current.subject,
              body: polishedBody
            }
          };

          setEditedEmailMap(updatedMap);
          await saveToCloud({ editedEmailMap: updatedMap });
          setIsAiLoading(false);
          showToast(`Polished draft with '${aiTone}' tone & synced to cloud!`);
        }, 600);
      };

      const uniqueReps = useMemo(() => {
        const reps = new Set(groupedClients.map(c => c.createdBy).filter(Boolean));
        return Array.from(reps);
      }, [groupedClients]);

      const filteredClients = useMemo(() => {
        return groupedClients.filter(c => {
          const isSent = !!sentMap[c.id];
          if (queueTab === 'UNSENT' && isSent) return false;
          if (queueTab === 'SENT' && !isSent) return false;

          if (selectedRep !== 'ALL' && c.createdBy.toLowerCase() !== selectedRep.toLowerCase()) {
            return false;
          }

          const isFinancingEligible = c.estimates.some(e => e.subtotal >= template.financingThreshold);
          if (financingFilter === 'ELIGIBLE' && !isFinancingEligible) return false;
          if (financingFilter === 'UNDER_4K' && isFinancingEligible) return false;

          const matchesSearch = 
            c.customerName.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.address.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.email.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.phone.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.createdBy.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.estimates.some(e => e.name.toLowerCase().includes(searchQuery.toLowerCase()));

          return matchesSearch;
        }).sort((a, b) => {
          if (sortBy === 'HIGHEST_VAL') {
            return b.totalSubtotal - a.totalSubtotal;
          }
          const dateA = new Date(a.createDate).getTime() || 0;
          const dateB = new Date(b.createDate).getTime() || 0;
          return sortBy === 'NEWEST' ? dateB - dateA : dateA - dateB;
        });
      }, [groupedClients, queueTab, selectedRep, financingFilter, searchQuery, sortBy, sentMap, template.financingThreshold]);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
          {/* Toast Notification Banner */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce border border-indigo-400">
              <span className="font-medium text-sm">✨ {toastMessage}</span>
            </div>
          )}

          {/* Top Header Bar */}
          <header className="border-b border-slate-800 bg-slate-950/90 backdrop-blur sticky top-0 z-30 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center font-black text-slate-900 shadow-lg shadow-orange-500/20 text-lg">
                EG
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  Eco Grizzly Estimate Follow-Up Engine
                  <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-orange-500/10 text-orange-400 border border-orange-500/30">
                    GitHub Pages & Firebase Live
                  </span>
                </h1>
                <p className="text-xs text-slate-400">Consolidates multiple estimate options by client & address with real-time team sync</p>
              </div>
            </div>

            <div className="flex items-center gap-2.5">
              <div className="px-3 py-2 rounded-lg text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
                {isSyncing ? '⚡ Syncing Cloud...' : '📡 Firestore Live Connected'}
              </div>

              <button 
                onClick={async () => { 
                  setRawRows(SAMPLE_DATA); 
                  setSentMap({}); 
                  setEditedEmailMap({});
                  setSelectedGroup(null);
                  await saveToCloud({ rawRows: SAMPLE_DATA, sentMap: {}, editedEmailMap: {} });
                  showToast('Reloaded sample dataset & synced across team!'); 
                }}
                className="px-3 py-2 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition border border-slate-700 flex items-center gap-1.5"
              >
                🔄 Reload Sample
              </button>

              <label className="px-3.5 py-2 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer transition shadow-md shadow-indigo-600/20 flex items-center gap-2">
                📁 Upload Excel (.xlsx) / CSV
                <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
              </label>
            </div>
          </header>

          {/* Top Filter Bar */}
          <section className="bg-slate-950/60 border-b border-slate-800 px-6 py-3 sticky top-[73px] z-20 backdrop-blur">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => setQueueTab('UNSENT')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                    queueTab === 'UNSENT' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Unsent Queue ({groupedClients.filter(c => !sentMap[c.id]).length})
                </button>

                <button
                  onClick={() => setQueueTab('SENT')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${
                    queueTab === 'SENT' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Sent History ({Object.keys(sentMap).filter(id => sentMap[id]).length})
                </button>

                <button
                  onClick={() => setQueueTab('ALL')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    queueTab === 'ALL' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  All Records ({groupedClients.length})
                </button>
              </div>

              <div className="flex flex-wrap items-center gap-2.5 flex-1 justify-end">
                <input 
                  type="text"
                  placeholder="🔍 Search name, address, email..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-900 border border-slate-700/80 px-3 py-1.5 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 min-w-[200px]"
                />

                <div className="flex items-center gap-1 bg-slate-900 border border-slate-700 px-2.5 py-1.5 rounded-xl text-xs">
                  <span className="text-slate-400 text-[11px]">Estimator:</span>
                  <select
                    value={selectedRep}
                    onChange={(e) => setSelectedRep(e.target.value)}
                    className="bg-transparent text-white focus:outline-none font-bold cursor-pointer text-xs"
                  >
                    <option value="ALL" className="bg-slate-900 text-white">All Estimators ({uniqueReps.length})</option>
                    {uniqueReps.map(rep => (
                      <option key={rep} value={rep} className="bg-slate-900 text-white">{rep}</option>
                    ))}
                  </select>
                </div>

                <div className="flex items-center gap-1 bg-slate-900 border border-slate-700 px-2.5 py-1.5 rounded-xl text-xs">
                  <select
                    value={financingFilter}
                    onChange={(e) => setFinancingFilter(e.target.value)}
                    className="bg-transparent text-white focus:outline-none font-semibold cursor-pointer text-xs"
                  >
                    <option value="ALL" className="bg-slate-900 text-white">All Financing Options</option>
                    <option value="ELIGIBLE" className="bg-slate-900 text-emerald-400">≥ $4,000 Option (Financing)</option>
                    <option value="UNDER_4K" className="bg-slate-900 text-slate-300">Under $4,000 (No Financing)</option>
                  </select>
                </div>
              </div>
            </div>
          </section>

          {/* Main Content Workspace */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* Left Column: Client Queue */}
              <div className="lg:col-span-5 space-y-3">
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">
                  Queue ({filteredClients.length})
                </h2>

                <div className="space-y-3 max-h-[720px] overflow-y-auto pr-1">
                  {filteredClients.length === 0 ? (
                    <div className="p-8 text-center bg-slate-800/40 border border-slate-800 rounded-2xl">
                      <p className="text-sm font-semibold text-slate-300">No matching estimates in this view.</p>
                    </div>
                  ) : (
                    filteredClients.map((client) => {
                      const isSelected = selectedGroup?.id === client.id;
                      const isSent = !!sentMap[client.id];
                      const hasMulti = client.estimates.length > 1;
                      const hasFinancing = client.estimates.some(e => e.subtotal >= template.financingThreshold);

                      return (
                        <div 
                          key={client.id}
                          onClick={() => setSelectedGroup(client)}
                          className={`p-4 rounded-2xl border transition cursor-pointer relative overflow-hidden ${
                            isSelected 
                              ? 'bg-slate-800 border-indigo-500 ring-2 ring-indigo-500/20 shadow-xl' 
                              : 'bg-slate-800/40 border-slate-800 hover:border-slate-700 hover:bg-slate-800/70'
                          }`}
                        >
                          <div className="flex items-center justify-between gap-2 mb-2">
                            <div className="flex items-center gap-1.5 flex-wrap">
                              {hasMulti && (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30">
                                  📚 {client.estimates.length} Options
                                </span>
                              )}
                              {hasFinancing && (
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                  💳 +$4k Option Financing
                                </span>
                              )}
                            </div>

                            <div className="flex items-center gap-2">
                              <span className="text-[10px] text-slate-400 font-mono">📅 {client.createDate}</span>
                              {isSent ? (
                                <span className="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">
                                  ✓ Sent
                                </span>
                              ) : (
                                <span className="text-[10px] font-semibold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20">
                                  Unsent
                                </span>
                              )}
                            </div>
                          </div>

                          <div className="flex items-start justify-between">
                            <div>
                              <h4 className="text-sm font-bold text-white">{client.customerName}</h4>
                              <p className="text-xs text-slate-400 truncate max-w-[210px] mt-0.5">📍 {client.address}</p>
                            </div>
                            <div className="text-right">
                              <span className="text-sm font-black text-indigo-400">
                                ${client.totalSubtotal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                              </span>
                              <p className="text-[10px] text-slate-400 font-medium">By {client.createdBy}</p>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>

              {/* Right Column: Draft Editor & Quick Copy */}
              <div className="lg:col-span-7">
                {selectedGroup ? (
                  <div className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 sticky top-[135px] space-y-5 shadow-2xl">
                    
                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-700/80 pb-4">
                      <div>
                        <h3 className="text-lg font-bold text-white flex items-center gap-2">
                          {selectedGroup.customerName}
                          <span className="text-xs font-normal text-slate-400 font-mono">({selectedGroup.createDate})</span>
                        </h3>
                        <p className="text-xs text-slate-400 mt-0.5">📍 {selectedGroup.address}</p>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => handleAiPolish(selectedGroup)}
                          disabled={isAiLoading}
                          className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-semibold shadow-md flex items-center gap-1.5 transition disabled:opacity-50"
                        >
                          ✨ {isAiLoading ? 'Polishing...' : 'AI Rewrite'}
                        </button>

                        <button
                          onClick={async () => {
                            const newSent = !sentMap[selectedGroup.id];
                            const updatedSentMap = { ...sentMap, [selectedGroup.id]: newSent };
                            setSentMap(updatedSentMap);
                            await saveToCloud({ sentMap: updatedSentMap });
                            showToast(newSent ? 'Marked as Sent & synced to Firestore!' : 'Moved back to Unsent Queue!');
                          }}
                          className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition border ${
                            sentMap[selectedGroup.id] 
                              ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' 
                              : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'
                          }`}
                        >
                          {sentMap[selectedGroup.id] ? '✓ Sent' : 'Mark Sent'}
                        </button>
                      </div>
                    </div>

                    {/* ServiceTitan Toolbar */}
                    <div className="bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 text-xs">
                      <span className="text-slate-400 font-medium">ServiceTitan Quick-Copy:</span>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => copyToClipboard(selectedGroup.phone, 'Customer Phone')}
                          className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-mono text-xs flex items-center gap-1.5 transition"
                        >
                          📞 {selectedGroup.phone || 'No Phone'}
                        </button>
                        <button
                          onClick={() => copyToClipboard(selectedGroup.email, 'Customer Email')}
                          className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-mono text-xs flex items-center gap-1.5 transition"
                        >
                          ✉️ {selectedGroup.email || 'No Email'}
                        </button>
                      </div>
                    </div>

                    {/* Email Draft Output */}
                    {(() => {
                      const defaultContent = generateEmailContent(selectedGroup);
                      const content = editedEmailMap[selectedGroup.id] || defaultContent;

                      const handleSubjectChange = async (val) => {
                        const newMap = { ...editedEmailMap, [selectedGroup.id]: { ...content, subject: val } };
                        setEditedEmailMap(newMap);
                        await saveToCloud({ editedEmailMap: newMap });
                      };

                      const handleBodyChange = async (val) => {
                        const newMap = { ...editedEmailMap, [selectedGroup.id]: { ...content, body: val } };
                        setEditedEmailMap(newMap);
                        await saveToCloud({ editedEmailMap: newMap });
                      };

                      const gmailComposeUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(selectedGroup.email)}&su=${encodeURIComponent(content.subject)}&body=${encodeURIComponent(content.body)}`;

                      const markAsSentAndRemove = async () => {
                        const updatedSent = { ...sentMap, [selectedGroup.id]: true };
                        setSentMap(updatedSent);
                        await saveToCloud({ sentMap: updatedSent });
                        showToast(`Follow-up launched! Client moved to Sent History.`);
                      };

                      return (
                        <div className="space-y-4">
                          <div>
                            <div className="flex items-center justify-between mb-1">
                              <label className="text-xs font-semibold text-slate-400">Generated Subject Line</label>
                              <button 
                                onClick={() => copyToClipboard(content.subject, 'Subject')}
                                className="text-[11px] text-indigo-400 hover:underline"
                              >
                                Copy Subject
                              </button>
                            </div>
                            <input 
                              type="text" 
                              value={content.subject}
                              onChange={(e) => handleSubjectChange(e.target.value)}
                              className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none"
                            />
                          </div>

                          <div>
                            <div className="flex items-center justify-between mb-1">
                              <label className="text-xs font-semibold text-slate-400">Email Draft Body (Signed off by Carlos)</label>
                              <button 
                                onClick={() => copyToClipboard(content.body, 'Body')}
                                className="text-[11px] text-indigo-400 hover:underline"
                              >
                                Copy Body
                              </button>
                            </div>
                            <textarea 
                              rows={11}
                              value={content.body}
                              onChange={(e) => handleBodyChange(e.target.value)}
                              className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 font-sans leading-relaxed focus:border-indigo-500 focus:outline-none"
                            />
                          </div>

                          <a
                            href={gmailComposeUrl}
                            target="_blank"
                            rel="noreferrer"
                            onClick={markAsSentAndRemove}
                            className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold text-xs shadow-lg shadow-red-600/20 flex items-center justify-center gap-2 transition"
                          >
                            ✉️ Open Draft in Gmail Web & Mark Sent ↗
                          </a>
                        </div>
                      );
                    })()}

                  </div>
                ) : (
                  <div className="bg-slate-800/30 border border-dashed border-slate-800 rounded-2xl p-12 text-center h-full flex flex-col items-center justify-center min-h-[400px]">
                    <h3 className="text-sm font-bold text-slate-300">No Client Selected</h3>
                    <p className="text-xs text-slate-500 max-w-sm mt-1">
                      Select a client from the left queue to view their grouped estimates and email draft.
                    </p>
                  </div>
                )}
              </div>

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
